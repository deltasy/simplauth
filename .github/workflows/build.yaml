name: Tests Pipeline

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

env:
  ENV_TYPE: "action-test"
  JWT_SECRET: "dummy"
  URL: "dummy"
  PORT: "3000"
  DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/watcherz_test"
  JWT_ATOKEN_EXPIRES_IN: "1m"
  JWT_RTOKEN_EXPIRES_IN: "7d"
  JWT_RTOKEN_EXPIRES_MS: "604800000"

defaults:
  run:
    working-directory: ./watcherz-api

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Branch clone
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: './watcherz-api/package-lock.json'
          
      - name: Install requirements
        run: npm ci

      - name: Prisma start
        working-directory: ./watcherz-api
        run: npx prisma generate
        
      - name: Test
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: watcherz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Branch clone
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: './watcherz-api/package-lock.json'
          
      - name: Install requirements
        run: npm ci
        
      - name: Prisma start
        run: npx prisma generate
        
      - name: Test
        run: npm run test:integration:ci