name: Type Checking

on: [push, pull_request]

jobs:
  syntax-check:
    name: Typescript syntax check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@dummy:5432/db
      PORT: 3000
      ENV_TYPE: production
      JWT_SECRET: secret
      JWT_ATOKEN_EXPIRES_IN: 1m
      JWT_RTOKEN_EXPIRES_IN: 7d
      JWT_RTOKEN_EXPIRES_MS: 604800000

    steps:
      - name: Branch checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

  docker_check:
    name: Docker check
    runs-on: ubuntu-latest

    steps:
      - name: Branch checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate

      - name: Docker check
        run: docker compose up --build