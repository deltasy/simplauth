name: Type Checking

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Branch checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate

      - name: Type Checking
        run: npx tsc --noEmit