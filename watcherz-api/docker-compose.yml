services:
  api:
    build:
      context: ../
      dockerfile: watcherz-api/Dockerfile
      
    ports:
      - "3000:3000"

    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://docker:docker@postgres:5432/watcher-zero}
      
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: "postgres:16"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: watcher-zero

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d watcher-zero"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: {}