services:
  api:
    build: .
    ports:
      - "3000:3000"

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-3000}
      - ENV_TYPE=${ENV_TYPE:-development}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ATOKEN_EXPIRES_IN=${JWT_ATOKEN_EXPIRES_IN:-1m}
      - JWT_RTOKEN_EXPIRES_IN=${JWT_RTOKEN_EXPIRES_IN:-7d}
      - JWT_RTOKEN_EXPIRES_MS=${JWT_RTOKEN_EXPIRES_MS:-604800000}

    depends_on:
      - postgres

  postgres:
    image: "postgres:16"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: watcher-zero

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: {}