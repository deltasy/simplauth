services:
  api:
    build: .
    ports:
      - "3000:3000"

    env_file:
      - .env.production.local

    depends_on:
      - postgres

  postgres:
    image: "postgres:16"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: watcher-zero

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: {}